<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Get in Touch</h1>
        <p class="subtitle">Fill out the form below to send us a message.</p>
        
        <form id="contactForm" novalidate>
            <div class="input-group">
                <label for="name">Full Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
                <span class="error-message" id="name-error"></span>
            </div>
            
            <div class="input-group">
                <label for="email">Email Address <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                <span class="error-message" id="email-error"></span>
            </div>
            
            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" placeholder="(123) 456-7890">
            </div>
            
            <div class="input-group">
                <label for="subject">Subject <span class="required">*</span></label>
                <input type="text" id="subject" name="subject" placeholder="What is this regarding?" required>
                <span class="error-message" id="subject-error"></span>
            </div>
            
            <div class="input-group">
                <label for="message">Message <span class="required">*</span></label>
                <textarea id="message" name="message" placeholder="Your message here..." required></textarea>
                <span class="error-message" id="message-error"></span>
            </div>
            
            <div class="form-buttons">
                <button type="reset" class="reset-btn">Reset</button>
                <button type="submit" class="submit-btn">Submit</button>
            </div>
            
            <div id="form-success" class="success-message">
                Thank you! Your message has been sent successfully.
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const contactForm = document.getElementById('contactForm');
            const formSuccess = document.getElementById('form-success');
            
            // Function to validate email format
            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }
            
            // Function to show error
            function showError(input, message) {
                const errorElement = document.getElementById(input.id + '-error');
                errorElement.textContent = message;
                input.classList.add('error');
            }
            
            // Function to clear error
            function clearError(input) {
                const errorElement = document.getElementById(input.id + '-error');
                errorElement.textContent = '';
                input.classList.remove('error');
            }
            
            // Add input event listeners to clear errors when user starts typing
            const inputs = contactForm.querySelectorAll('input, textarea');
            inputs.forEach(input => {
                input.addEventListener('input', function() {
                    clearError(input);
                });
            });
            
            // Form submission handler
            contactForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const name = document.getElementById('name');
                const email = document.getElementById('email');
                const subject = document.getElementById('subject');
                const message = document.getElementById('message');
                
                let isValid = true;
                
                // Validate name
                if (name.value.trim() === '') {
                    showError(name, 'Please enter your name');
                    isValid = false;
                }
                
                // Validate email
                if (email.value.trim() === '') {
                    showError(email, 'Please enter your email address');
                    isValid = false;
                } else if (!isValidEmail(email.value.trim())) {
                    showError(email, 'Please enter a valid email address');
                    isValid = false;
                }
                
                // Validate subject
                if (subject.value.trim() === '') {
                    showError(subject, 'Please enter a subject');
                    isValid = false;
                }
                
                // Validate message
                if (message.value.trim() === '') {
                    showError(message, 'Please enter your message');
                    isValid = false;
                }
                
                // If form is valid, show success message
                if (isValid) {
                    // In a real application, you would send data to a server here
                    formSuccess.style.display = 'block';
                    contactForm.reset();
                    
                    // Hide success message after 5 seconds
                    setTimeout(function() {
                        formSuccess.style.display = 'none';
                    }, 5000);
                }
            });
            
            // Reset form handler
            contactForm.addEventListener('reset', function() {
                // Clear all errors
                inputs.forEach(input => {
                    clearError(input);
                });
                
                // Hide success message
                formSuccess.style.display = 'none';
            });
        });
    </script>
</body>
</html>
